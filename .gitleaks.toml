# Secret-scan configuration (SEC-61). Uses the built-in gitleaks rules.
# Add an allowlist entry only with a comment explaining why the match is not a secret.
title = "therapy_service_hours"

[extend]
useDefault = true

# oapi-codegen embeds the gzipped OpenAPI spec in internal/http/gen/api.gen.go as a base64 string
# literal. Its high entropy trips generic-api-key, but it is public API documentation, not a secret.
# Scoped to that one generated file and that one rule so a real key anywhere else is still caught.
[[allowlists]]
description = "Base64 OpenAPI spec embedded by oapi-codegen"
targetRules = ["generic-api-key"]
paths = ['''internal/http/gen/api\.gen\.go''']
