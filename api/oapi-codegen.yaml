# oapi-codegen configuration (ADR-0006). Regenerate with `go generate ./...`; CI fails if the output is stale.
package: gen
output: api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # S2-03 publishes the log-hours contract before S2-05 to S2-08 implement its routes. Generate the
  # models now; each of those tickets removes its operations from this list so the strict server
  # method becomes required. S2-07 (clients) and S2-08 (categories) are implemented, so their operations
  # are no longer excluded.
  exclude-operation-ids:
    - createEntry
    - getEntry
    - updateEntry
    - deleteEntry
