# oapi-codegen configuration (ADR-0006). Regenerate with `go generate ./...`; CI fails if the output is stale.
package: gen
output: api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # A contract published before its handlers exist lists the operations that are not implemented yet
  # here, so the models are generated but no route is. Each ticket removes its operations from the
  # list. S4-01 published the import and export operations; S4-06 implemented exportEntries and S4-04
  # implemented importMarkdown, so nothing was excluded after that. S6-02 published the supervision
  # and notification operations; S6-03 to S6-07 implement them and each removes its own.
  exclude-operation-ids:
    - searchSupervisors
    - listSupervisionLinks
    - createSupervisionLink
    - cancelSupervisionLink
    - acceptSupervisionLink
    - declineSupervisionLink
    - endSupervisionLink
    - listNotifications
    - getUnreadNotificationCount
    - markAllNotificationsRead
    - markNotificationRead
