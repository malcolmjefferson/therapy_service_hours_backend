# oapi-codegen configuration (ADR-0006). Regenerate with `go generate ./...`; CI fails if the output is stale.
package: gen
output: api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # A contract published before its handlers exist lists the operations that are not implemented yet
  # here, so the models are generated but no route is. Each ticket removes its operations from the
  # list. S4-01 published the import and export operations; S4-06 implemented exportEntries; S4-04 implements importMarkdown.
  exclude-operation-ids:
    - importMarkdown
