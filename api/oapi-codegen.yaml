# oapi-codegen configuration (ADR-0006). Regenerate with `go generate ./...`; CI fails if the output is stale.
package: gen
output: api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # S1-05 publishes the contract before S1-08 implements its route. Generate the
  # models now; remove this filter in S1-08 to require the strict server method.
  exclude-operation-ids: [getMe]
