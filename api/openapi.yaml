openapi: 3.1.0
info:
  title: Therapy Service Hours API
  version: 0.1.0
  summary: Contract between the SPA and the Go API (ADR-0006). This file is the source of truth.
  description: |
    Conventions every endpoint follows (see api/README.md for the full list):

    - **Base path** `/api/v1`, JSON bodies, `snake_case` field names.
    - **Errors** from the API are RFC 7807 `application/problem+json` using the `Problem` schema.
      Clients branch on `type`, which is a stable URN per error kind. The Gateway authorizer's own
      401 response is `application/json` with a `message` field; clients handle either shape.
    - **Pagination:** list endpoints take `page` (1-based) and `page_size` (default 50, maximum 200)
      and return `items` plus a `page` object (`PageInfo`). Order is stable, with `id` as the tiebreaker.
    - **Idempotency:** POST endpoints that create or bulk-change data take the `Idempotency-Key` header.
      Repeating a key with the same body returns the original result; a different body returns 409.
    - **Authentication:** every route requires a Cognito ID token except those that declare
      `security: []`. Roles come from the database; token group claims grant no permissions.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - cognitoJwt: []
tags:
  - name: system
    description: Operational endpoints
  - name: identity
    description: Current authenticated user
  - name: categories
    description: Service categories (lookup data)
  - name: clients
    description: The current user's saved clients and groups (pseudonyms or initials only)
  - name: entries
    description: The current user's own hours entries
  - name: import-export
    description: Import of the prototype's Markdown ledger and export of the current user's entries
  - name: supervision
    description: Supervisor search and the supervision link lifecycle (request, cancel, accept, decline, end)
  - name: notifications
    description: The current user's in-app notifications
  - name: admin-organizations
    description: Admin only. Create, rename and delete organizations
  - name: admin-users
    description: Admin only. Invite, edit, set roles, move, deactivate and delete users
  - name: admin-audit
    description: Admin only. The append-only log of admin actions
paths:
  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Read the current user's profile and effective roles
      description: |
        Returns explicit profile fields for an active, invited user. Roles are re-read from the
        database on each request. The first request binds a verified identity and accepts the
        invitation in one transaction; an uninvited or deactivated user is refused.
      responses:
        '200':
          description: The current active user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                id: '00000000-0000-4000-8000-000000000002'
                name: Pseudonym A
                email: pseudonym-a@example.test
                roles: [admin]
                organization:
                  id: '00000000-0000-4000-8000-000000000001'
                  name: Default Organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the API is up and which build is running
      description: Public and cheap. It touches no user data (GO-67).
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List the service categories, grouped for the entry form
      description: |
        Lookup data (FR-LOG-07): the 12 categories in display order, grouped Direct Service,
        Indirect Service and Supervision. The list changes rarely, so the response is cacheable
        by the browser. It is not paginated because it is small and fixed.
      responses:
        '200':
          description: The categories, grouped, in display order.
          headers:
            Cache-Control:
              description: Cacheable by the user's browser only, for example `private, max-age=3600`.
              schema:
                type: string
                maxLength: 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the current user's saved clients
      description: Only the caller's own clients are returned, ordered by name (case-insensitive), then `id`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of the caller's clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createClient
      tags: [clients]
      summary: Save a new client
      description: |
        Names are unique per user, ignoring case. If the name is already saved, the API returns
        **409** with problem type `urn:therapy-service-hours:problem:client-name-taken` and the
        existing client in `existing_client`, so the form can select it instead. It does not
        silently return the existing client.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: The client was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ClientConflict'
        default:
          $ref: '#/components/responses/Problem'
  /clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    patch:
      operationId: renameClient
      tags: [clients]
      summary: Rename one of the caller's clients
      description: |
        A name that another of the caller's clients already uses (ignoring case) returns **409**
        `urn:therapy-service-hours:problem:client-name-taken`. Changing only the letter case of the
        client's own name is allowed. Another user's client is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '200':
          description: The renamed client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClientConflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete one of the caller's clients
      description: |
        A client that no entry uses is deleted. If entries use it and `confirm_detach` is not
        `true`, the API returns **409** `urn:therapy-service-hours:problem:client-in-use` with
        `entry_count`, so the UI can ask for confirmation. With `confirm_detach=true` the client is
        removed from those entries and deleted. Another user's client is `404`.
      parameters:
        - name: confirm_detach
          in: query
          description: Set to `true` to delete a client that entries still use, detaching it from them.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: The client was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClientConflict'
        default:
          $ref: '#/components/responses/Problem'
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List the caller's own entries
      description: |
        Filters combine with AND. `client` is a case-insensitive substring match against the
        names of the clients on an entry; `%`, `_` and `\` in it match literally (SEC-20 to SEC-25).
        `sort` and `dir` take only the listed values, anything else is **400**. The default order is
        newest first (`session_date` descending, then start time descending). Sorting by `category`
        orders by category group, then category name. Ties are broken by `id`, so pages are stable.
      parameters:
        - name: group
          in: query
          description: Only entries whose category is in this group.
          required: false
          schema:
            $ref: '#/components/schemas/CategoryGroup'
        - name: client
          in: query
          description: Only entries with a client whose name contains this text, ignoring case.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: from
          in: query
          description: Earliest `session_date`, inclusive.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest `session_date`, inclusive. Must not be before `from`.
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: Column to sort by.
          required: false
          schema:
            type: string
            enum: [session_date, category, client, hours, on_site]
            default: session_date
        - name: dir
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of the caller's entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createEntry
      tags: [entries]
      summary: Log a new entry
      description: |
        The server calculates `duration_minutes` and `hours` from the times; a request that sends
        either (or any other unknown field) is **400** (FR-LOG-02). The new entry is `pending`.
        A session that overlaps another of the caller's non-rejected sessions is **409**
        `urn:therapy-service-hours:problem:entry-overlap`, naming the clashing session in
        `conflicting_entry`. Repeating a request with the same `Idempotency-Key` and body returns
        the original result (see the `Idempotency-Key` parameter).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '201':
          description: The entry was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/EntryConflict'
        default:
          $ref: '#/components/responses/Problem'
  /entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getEntry
      tags: [entries]
      summary: Read one of the caller's entries
      description: Another user's entry is `404`, never `403`, so its existence is not disclosed.
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateEntry
      tags: [entries]
      summary: Replace one of the caller's pending or rejected entries
      description: |
        Replaces every editable field, so omitted optional fields return to their defaults. Saving
        an edited `rejected` entry sets it back to `pending`. An `approved` entry is locked and
        returns **409** `urn:therapy-service-hours:problem:entry-locked`. An overlap returns **409**
        `urn:therapy-service-hours:problem:entry-overlap`. Another user's entry is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '200':
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete one of the caller's pending or rejected entries
      description: |
        An `approved` entry is locked and returns **409** `urn:therapy-service-hours:problem:entry-locked`.
        Another user's entry is `404`.
      responses:
        '204':
          description: The entry was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        default:
          $ref: '#/components/responses/Problem'
  /import/markdown:
    post:
      operationId: importMarkdown
      tags: [import-export]
      summary: Import a Markdown ledger into the caller's own entries
      description: |
        Imports the prototype's `.md` ledger (CLAUDE.md section 12.3) as the caller's own data. Both
        layouts are accepted: with and without `Start` and `End` columns. A row without times is
        imported as `needs_time` with its hours kept (FR-IO-02). Client names from the
        `Clients / Groups` section and from the rows are merged into the caller's saved clients,
        ignoring case (FR-IO-03). The file is parsed to typed values first; no cell is ever
        interpreted as SQL, a formula or markup.

        **Limits:** the file is at most 1 MiB (1,048,576 bytes) and the entries table has at most
        5,000 rows. A larger file is **413** `urn:therapy-service-hours:problem:body-too-large`; more
        rows is **413** `urn:therapy-service-hours:problem:import-too-many-rows`. Both are refused
        before anything is stored. A file that is not a Markdown ledger (wrong content type, not
        UTF-8 text, or no entries table) is **400** `urn:therapy-service-hours:problem:validation`.

        **Row policy:** the import is one transaction. A bad row does not fail the import: valid
        rows are kept and each row that was not imported is listed in `skipped_rows` with a reason
        (ASM-07). Re-importing the same file imports nothing and reports every row as a
        `duplicate`. The 200 response is the report; it is also what an idempotent retry returns.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMarkdownRequest'
            encoding:
              file:
                contentType: text/markdown, text/plain
      responses:
        '200':
          description: The import ran. The report says what was imported and what was skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
              example:
                total_rows: 4
                imported_count: 2
                needs_time_count: 1
                merged_clients:
                  - client: { id: '00000000-0000-4000-8000-0000000000d1', name: Pseudonym A }
                    created: true
                  - client: { id: '00000000-0000-4000-8000-0000000000d2', name: Pseudonym B }
                    created: false
                skipped_count: 2
                skipped_rows:
                  - row: 3
                    reason: duplicate
                    message: Same date, category, hours, notes and clients as an existing entry.
                  - row: 4
                    reason: unknown-category
                    field: category
                    message: The category is not one of the service categories.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Problem'
  /export/entries:
    get:
      operationId: exportEntries
      tags: [import-export]
      summary: Page through all of the caller's own entries for export
      description: |
        Everything a Markdown, CSV or PDF export needs, for the caller's entries only (FR-IO-04):
        date, `start_time` and `end_time` (absent on a `needs_time` entry), hours, category with its
        group, clients, on-site flag, notes and status. The client builds the file, so the export
        works the same way for every format and the PDF needs no second call (FR-IO-06).

        There are no filters: an export is the whole ledger. The order is oldest first
        (`session_date`, then start time, then `id`) and does not change between pages. Entries
        without times come before timed entries of the same date. The page size is capped at 200,
        so a client reads `page` 1 up to `ceil(total_items / page_size)`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of the caller's entries, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /supervisors:
    get:
      operationId: searchSupervisors
      tags: [supervision]
      summary: Search active supervisors in the caller's organization
      description: |
        Lists active supervisors in the **caller's own organization**, ordered by last name, first
        name, then `id`. Supervisors in other organizations, deactivated supervisors and the caller
        are never returned. `search` matches the start or any part of a first or last name,
        ignoring case; `%`, `_` and `\` in it match literally. A `search` longer than 64
        characters is a `400`. Each item is a dedicated DTO (id and display name only; no email,
        roles or organization). The page that lists them shows the caller's own link state from
        `GET /supervision-links?role=as_supervisee`.
      parameters:
        - name: search
          in: query
          description: Part of a first or last name. Wildcard characters match literally.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of supervisors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /supervision-links:
    get:
      operationId: listSupervisionLinks
      tags: [supervision]
      summary: List the caller's supervision links
      description: |
        `role=as_supervisee` lists links where the caller is the supervisee (their current supervisor
        or pending request, and their history); `role=as_supervisor` lists links where the caller is
        the supervisor, which is the **inbox** with `status=pending` and the accepted supervisees
        with `status=accepted`. Only the caller's own links are returned; a user who is not a
        supervisor gets an empty list for `role=as_supervisor`. Newest request first, then `id`.
      parameters:
        - name: role
          in: query
          description: Which side of the link the caller is on.
          required: true
          schema:
            $ref: '#/components/schemas/SupervisionRole'
        - name: status
          in: query
          description: Only links in this status. All statuses when omitted.
          required: false
          schema:
            $ref: '#/components/schemas/SupervisionLinkStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLinkListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupervisionLink
      tags: [supervision]
      summary: Request supervision from a supervisor
      description: |
        Creates a `pending` link from the caller to `supervisor_id` and notifies the supervisor in
        the same transaction. The supervisor must be an active supervisor in the caller's
        organization; anyone else (another organization, not a supervisor, deactivated, a missing
        id) is `404`, so existence is not disclosed. Requesting yourself is `400`. A caller with a
        pending or accepted link gets **409**
        `urn:therapy-service-hours:problem:supervision-link-exists`; cancel or end it first.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisionRequest'
      responses:
        '201':
          description: The request was created and is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupervisionConflict'
        default:
          $ref: '#/components/responses/Problem'
  /supervision-links/{linkId}/cancel:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: cancelSupervisionLink
      tags: [supervision]
      summary: Cancel the caller's pending request
      description: |
        Only the supervisee can cancel, and only while the link is `pending`. Any other caller, or
        a link that does not exist, is `404`. The link is no longer pending: **409**
        `urn:therapy-service-hours:problem:supervision-request-no-longer-valid`. Repeating the call
        is safe because the state check answers it, so no `Idempotency-Key` is taken.
      x-idempotency: not-required
      responses:
        '200':
          description: The cancelled link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupervisionConflict'
        default:
          $ref: '#/components/responses/Problem'
  /supervision-links/{linkId}/accept:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: acceptSupervisionLink
      tags: [supervision]
      summary: Accept a pending request
      description: |
        Only the link's supervisor can accept. The organization and link state are re-checked
        inside the transaction: a link that was cancelled, answered already, or whose people no
        longer share an organization is **409**
        `urn:therapy-service-hours:problem:supervision-request-no-longer-valid`. Any other caller,
        or a missing link, is `404`. The supervisee is notified. No `Idempotency-Key` is taken
        because the state check answers a repeat.
      x-idempotency: not-required
      responses:
        '200':
          description: The accepted link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupervisionConflict'
        default:
          $ref: '#/components/responses/Problem'
  /supervision-links/{linkId}/decline:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: declineSupervisionLink
      tags: [supervision]
      summary: Decline a pending request
      description: |
        Only the link's supervisor can decline, and no reason is needed or accepted. The supervisee
        is notified. A link that is no longer pending is **409**
        `urn:therapy-service-hours:problem:supervision-request-no-longer-valid`; any other caller,
        or a missing link, is `404`. No `Idempotency-Key` is taken because the state check answers
        a repeat.
      x-idempotency: not-required
      responses:
        '200':
          description: The declined link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupervisionConflict'
        default:
          $ref: '#/components/responses/Problem'
  /supervision-links/{linkId}/end:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: endSupervisionLink
      tags: [supervision]
      summary: End an accepted link
      description: |
        The supervisee, the supervisor or an admin can end an `accepted` link. History and past
        approvals are kept, and the other party is notified. Any other caller, or a missing link,
        is `404`. A link that is not accepted is **409**
        `urn:therapy-service-hours:problem:supervision-link-not-active`. No `Idempotency-Key` is
        taken because the state check answers a repeat.
      x-idempotency: not-required
      responses:
        '200':
          description: The ended link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SupervisionConflict'
        default:
          $ref: '#/components/responses/Problem'
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the caller's notifications
      description: Only the caller's own notifications, newest first, then `id`.
      parameters:
        - name: unread_only
          in: query
          description: Set to `true` to list only unread notifications.
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Count the caller's unread notifications
      description: |
        Polled by the client about every 60 seconds and when the window regains focus, so it
        returns only the count.
      responses:
        '200':
          description: The number of unread notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the caller's notifications read
      description: |
        Marks every unread notification of the caller read. Repeating it changes nothing (the
        second answer has `marked_count` 0), so no `Idempotency-Key` is taken.
      x-idempotency: not-required
      responses:
        '200':
          description: How many notifications were newly marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification read
      description: |
        Marks the caller's notification read. Already-read notifications are returned unchanged
        (the original `read_at` is kept), so no `Idempotency-Key` is taken. Another user's
        notification, or a missing one, is `404`.
      x-idempotency: not-required
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /admin/organizations:
    get:
      operationId: listAdminOrganizations
      tags: [admin-organizations]
      summary: List all organizations with their member counts
      description: |
        Admin only (FR-ADM-01). Admin scope is global, so every organization is listed. Ordered by
        name (case-insensitive), then `id`. A non-admin caller is **403** `urn:therapy-service-hours:problem:forbidden`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminOrganization
      tags: [admin-organizations]
      summary: Create an organization
      description: |
        Admin only (FR-ADM-01). Names are unique, ignoring case and surrounding spaces. A name that
        is taken is **409** `urn:therapy-service-hours:problem:organization-name-taken`. The change is
        written to the audit log in the same transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrganizationRequest'
      responses:
        '201':
          description: The organization was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          $ref: '#/components/responses/AdminOrganizationConflict'
        default:
          $ref: '#/components/responses/Problem'
  /admin/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    patch:
      operationId: renameAdminOrganization
      tags: [admin-organizations]
      summary: Rename an organization
      description: |
        Admin only (FR-ADM-01). A name another organization already uses (ignoring case) is **409**
        `urn:therapy-service-hours:problem:organization-name-taken`; changing only the letter case of
        the organization's own name is allowed. An unknown organization is **404**. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrganizationRequest'
      responses:
        '200':
          description: The renamed organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminOrganizationConflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAdminOrganization
      tags: [admin-organizations]
      summary: Delete an organization that has no members
      description: |
        Admin only (FR-ADM-01). An organization that any user belongs to, active or deactivated, is
        not deleted: the answer is **409** `urn:therapy-service-hours:problem:organization-not-empty`
        with `user_count`. There is no way to force it. An unknown organization is **404**. Audited.
      responses:
        '204':
          description: The organization was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminOrganizationConflict'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List users for administration
      description: |
        Admin only (FR-ADM-02). This is the one user list that includes **deactivated** users, because
        an admin must find them to reactivate or permanently delete them (FR-ADM-05); every other list
        and search hides them (FR-ADM-09). Use `status` to narrow it. Filters combine with AND.
        `search` is a case-insensitive substring match against first name, last name, the full name
        and email; `%`, `_` and `\` in it match literally (SEC-20 to SEC-25). `sort` and `dir` take
        only the listed values, anything else is **400**. The default order is name ascending; ties are
        broken by `id`, so pages are stable. The response describes people only: it never carries
        entries, notes or clients (FR-ADM-10).
      parameters:
        - name: search
          in: query
          description: Only users whose name or email contains this text, ignoring case.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: organization_id
          in: query
          description: Only users in this organization.
          required: false
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: role
          in: query
          description: Only users who hold this role.
          required: false
          schema:
            $ref: '#/components/schemas/AdminRole'
        - name: status
          in: query
          description: Only users with this status. Omit to list both.
          required: false
          schema:
            $ref: '#/components/schemas/AdminUserStatus'
        - name: sort
          in: query
          description: Column to sort by.
          required: false
          schema:
            type: string
            enum: [name, email, organization, created_at]
            default: name
        - name: dir
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminUser
      tags: [admin-users]
      summary: Invite a user
      description: |
        Admin only (FR-ADM-02, US-29). Creates the user row and a pending invitation together, then
        the identity step prepares the Cognito side, so the person can sign in with Google. The
        organization is required; a missing or unknown `organization_id` is **400** `validation`.
        An email that belongs to another user, or that has a pending invitation, is **409**
        `urn:therapy-service-hours:problem:user-email-taken`.

        The work runs as one workflow (ADR-0002). If the identity step fails, the workflow undoes the
        database reservation and the answer is **502**
        `urn:therapy-service-hours:problem:identity-failure`; nothing was created and the same request
        can be sent again with the same `Idempotency-Key`. If the workflow does not finish in time the
        answer is **504** `urn:therapy-service-hours:problem:workflow-timeout`; the outcome is not
        known, so read the user list before retrying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: The user was created and invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          $ref: '#/components/responses/AdminUserConflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getAdminUser
      tags: [admin-users]
      summary: Read one user for administration
      description: |
        Admin only. Includes a deactivated user. The response describes the person only, never their
        entries or notes (FR-ADM-10). An unknown user is **404**.
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Edit a user's name
      description: |
        Admin only (FR-ADM-02). Changes the name fields that are sent. Roles, organization and email
        have their own operations because each has side effects: roles and email also change Cognito,
        and a new organization ends supervision links. An unknown user is **404**. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAdminUser
      tags: [admin-users]
      summary: Permanently delete a deactivated user
      description: |
        Admin only (FR-ADM-05, US-32). The second step of deletion: it removes the user's entries,
        clients, supervision links and notifications and the Cognito user. Only a **deactivated** user
        can be deleted; an active user is **409** `urn:therapy-service-hours:problem:user-not-deactivated`.
        The audit log keeps a snapshot of the display name (SEC-44). The UI asks the admin to type the
        user's name first; the API itself needs no confirmation field. The last-admin rule (FR-ADM-06)
        is enforced when an admin is deactivated, so a deactivated user is never the last active admin.
        Workflow failures map as on `createAdminUser` (**502**, **504**). An unknown user, including one
        already deleted, is **404**.
      responses:
        '204':
          description: The user and their data were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminUserConflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setAdminUserRoles
      tags: [admin-users]
      summary: Set the full role set of a user
      description: |
        Admin only (FR-ADM-03, US-30). Replaces the roles: `[]` is an ordinary user, and the base
        user capability is always kept. The database is authoritative; the Cognito groups follow in
        the same workflow, and the change takes effect on the user's next request at the latest
        (ADR-0002). Removing `admin` from the last remaining admin is **409**
        `urn:therapy-service-hours:problem:last-admin` (FR-ADM-06). Workflow failures map as on
        `createAdminUser` (**502**, **504**). An unknown user is **404**. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRolesRequest'
      responses:
        '200':
          description: The user with the new roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminUserConflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/email:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: changeAdminUserEmail
      tags: [admin-users]
      summary: Change a user's email and re-invite them
      description: |
        Admin only (FR-ADM-08, US-35). The old invitation is revoked and the old email loses access
        immediately (Cognito and the allowlist); a new pending invitation is created for the new
        email. The user keeps the same `id` and all data, and their first sign-in with the new email
        binds to the existing row. An email another user or a pending invitation already uses is
        **409** `urn:therapy-service-hours:problem:user-email-taken`. Sending the user's current email
        is **400** `validation`. Workflow failures map as on `createAdminUser` (**502**, **504**). An
        unknown user is **404**. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserEmailRequest'
      responses:
        '200':
          description: The user, signed out and awaiting the new sign-in (`has_signed_in` false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminUserConflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/organization:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setAdminUserOrganization
      tags: [admin-users]
      summary: Move a user to another organization
      description: |
        Admin only (FR-ADM-04, US-31). Ends the user's supervision link and cancels their pending
        requests; for a supervisor it also ends every supervisee's link. Nothing changes until the
        admin has seen the consequences, so the request must carry `confirm_consequences: true`
        (anything else is **400**); read them first from `previewAdminUserOrganizationChange`. The
        target organization must exist (**400** `validation` otherwise) and differ from the current
        one. An unknown user is **404**. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserOrganizationRequest'
      responses:
        '200':
          description: The user in the new organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/organization-change-preview:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: previewAdminUserOrganizationChange
      tags: [admin-users]
      summary: Preview what moving a user to another organization would end
      description: |
        Admin only (FR-ADM-04, US-31). Changes nothing. The counts feed the confirmation dialog; they
        are zero until supervision links exist (S6). A target organization that does not exist or is
        the user's current one is **400** `validation`. An unknown user is **404**.
      parameters:
        - name: organization_id
          in: query
          description: The organization the user would move to.
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        '200':
          description: What the move would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationChangePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateAdminUser
      tags: [admin-users]
      summary: Deactivate a user
      description: |
        Admin only (FR-ADM-05, FR-ADM-09, US-32). The first step of deletion: blocks sign-in (Cognito
        user disabled and signed out), hides the user from every list, search and schedule except the
        admin user list, and keeps all data. Deactivating the last remaining admin is **409**
        `urn:therapy-service-hours:problem:last-admin` (FR-ADM-06). Deactivating a user who is already
        deactivated returns the user unchanged. Workflow failures map as on `createAdminUser` (**502**,
        **504**). An unknown user is **404**. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AdminUserConflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/users/{userId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateAdminUser
      tags: [admin-users]
      summary: Reactivate a deactivated user
      description: |
        Admin only (FR-ADM-05, US-32). Restores access: the Cognito user is enabled and the user
        appears in lists again, with their data intact. Reactivating a user who is already active
        returns the user unchanged. Workflow failures map as on `createAdminUser` (**502**, **504**).
        An unknown user is **404**. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/IdentityFailure'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
        default:
          $ref: '#/components/responses/Problem'
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin-audit]
      summary: Page through the admin audit log
      description: |
        Admin only (FR-ADM-07, US-34). Every admin action, newest first (`created_at`, then `id`, both
        descending), so pages are stable. Rows survive the permanent deletion of the actor or the
        target; the name snapshots keep them readable. The log is read-only through the API and
        contains no entry, note or client content (FR-ADM-10).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of audit rows, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token, validated by the API Gateway JWT authorizer against the configured
        issuer and app-client audience (ADR-0008). The API reads identity only from authorizer
        context and requires verified email for first-sign-in binding; it never parses the bearer
        header for claims. Access tokens are not API credentials. Database roles are authoritative.
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Items per page (GO-56, ARC-16).
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated key, one per user action and reused on retry (GO-57, FE-34). Keys are kept
        for 24 hours and belong to the caller. Repeating a request with the same key and the same
        body returns the original **successful** response, marked `Idempotency-Replayed: true`,
        without creating anything again. The same key with a different body or endpoint is **409**
        `urn:therapy-service-hours:problem:idempotency-key-reused`. If the first request is still
        running, the answer is **409** `urn:therapy-service-hours:problem:idempotency-key-in-progress`
        with `Retry-After`; repeat the same request. An error response is not stored, so a request
        that failed can be sent again with the same key once its cause is fixed.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    EntryId:
      name: entryId
      in: path
      description: Entry identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    ClientId:
      name: clientId
      in: path
      description: Client identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    LinkId:
      name: linkId
      in: path
      description: Supervision link identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    NotificationId:
      name: notificationId
      in: path
      description: Notification identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    OrganizationId:
      name: organizationId
      in: path
      description: Organization identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    UserId:
      name: userId
      in: path
      description: User identifier.
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
  responses:
    Unauthorized:
      description: |
        Missing or invalid authentication. The API returns Problem. The API Gateway JWT
        authorizer instead returns application/json with a message field, before Lambda runs;
        HTTP APIs cannot customize that response. Clients must handle both shapes.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge when returned by the API.
          schema:
            type: string
            maxLength: 200
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayUnauthorized'
    Forbidden:
      description: Access has not been granted, or the current user is deactivated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found or may not be disclosed to this user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: |
        The request is invalid: a field is missing, malformed or out of range, an unknown field was
        sent (for example `hours`), or a query parameter is not allowed. `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EntryConflict:
      description: |
        The entry cannot be saved in its current state. `type` is
        `urn:therapy-service-hours:problem:entry-overlap` (the session overlaps another of the
        caller's non-rejected sessions; `conflicting_entry` names it) or
        `urn:therapy-service-hours:problem:entry-locked` (the entry is approved and cannot change).
        On `POST /entries` it can also be an idempotency problem (see the `Idempotency-Key` parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EntryConflictProblem'
    ClientConflict:
      description: |
        `type` is `urn:therapy-service-hours:problem:client-name-taken` (another of the caller's
        clients has that name, ignoring case; `existing_client` is that client) or
        `urn:therapy-service-hours:problem:client-in-use` (entries still use the client;
        `entry_count` says how many; repeat with `confirm_detach=true` to delete it anyway).
        On `POST /clients` it can also be an idempotency problem (see the `Idempotency-Key` parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ClientConflictProblem'
    Conflict:
      description: |
        The request cannot be completed in the current state. `type` is an idempotency problem (see
        the `Idempotency-Key` parameter): `urn:therapy-service-hours:problem:idempotency-key-reused`
        or `urn:therapy-service-hours:problem:idempotency-key-in-progress`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SupervisionConflict:
      description: |
        `type` is `urn:therapy-service-hours:problem:supervision-link-exists` (the caller already
        has a pending or accepted link), `urn:therapy-service-hours:problem:supervision-request-no-longer-valid`
        (the request is no longer pending, or its people no longer share an organization) or
        `urn:therapy-service-hours:problem:supervision-link-not-active` (the link is not accepted).
        On `POST /supervision-links` it can also be an idempotency problem (see the
        `Idempotency-Key` parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: |
        The upload is over a limit. `type` is `urn:therapy-service-hours:problem:body-too-large`
        (the file is over 1 MiB) or `urn:therapy-service-hours:problem:import-too-many-rows` (the
        entries table has more than 5,000 rows). Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminForbidden:
      description: |
        The caller is not an active admin, or is deactivated. `type` is
        `urn:therapy-service-hours:problem:forbidden`. Roles come from the database, not the token,
        and nothing is started or changed. Every admin route answers this way (US-30).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminOrganizationConflict:
      description: |
        `type` is `urn:therapy-service-hours:problem:organization-name-taken` (another organization
        has that name, ignoring case) or `urn:therapy-service-hours:problem:organization-not-empty`
        (users still belong to the organization; `user_count` says how many). On `POST` it can also be
        an idempotency problem (see the `Idempotency-Key` parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AdminOrganizationConflictProblem'
    AdminUserConflict:
      description: |
        The action is refused in the user's current state. `type` is one of
        `urn:therapy-service-hours:problem:user-email-taken` (the email belongs to another user or has a
        pending invitation), `urn:therapy-service-hours:problem:last-admin` (the action would leave no
        active admin; FR-ADM-06), or `urn:therapy-service-hours:problem:user-not-deactivated`
        (only a deactivated user can be permanently deleted). Nothing was changed. Where the operation
        takes `Idempotency-Key` it can also be an idempotency problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdentityFailure:
      description: |
        The identity step (Cognito) failed or was unreachable, and the workflow ran its compensation:
        the database was returned to its state before the request. `type` is
        `urn:therapy-service-hours:problem:identity-failure`. Nothing changed; the request can be
        repeated, with the same `Idempotency-Key` where the operation takes one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkflowTimeout:
      description: |
        The workflow did not finish within the API Gateway limit. `type` is
        `urn:therapy-service-hours:problem:workflow-timeout`. The outcome is **unknown**: the action
        may have completed or been compensated. Read the user again before repeating it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: An error, as RFC 7807 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MeResponse:
      type: object
      additionalProperties: false
      required: [id, name, email, roles, organization]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 401
        email:
          type: string
          format: email
          maxLength: 254
        roles:
          type: array
          uniqueItems: true
          maxItems: 2
          description: Effective database roles. An ordinary user has an empty array.
          items:
            type: string
            enum: [admin, supervisor]
        organization:
          $ref: '#/components/schemas/OrganizationProfile'
    OrganizationProfile:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 200
    CategoryGroup:
      type: string
      description: The group a category belongs to. It decides which goals the hours count toward.
      enum: [direct, indirect, supervision]
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 3
          description: Groups in display order, each with its categories in display order.
          items:
            $ref: '#/components/schemas/CategoryGroupSection'
    CategoryGroupSection:
      type: object
      additionalProperties: false
      required: [group, label, categories]
      properties:
        group:
          $ref: '#/components/schemas/CategoryGroup'
        label:
          type: string
          description: Display name, for example `Direct Service`.
          maxLength: 50
        categories:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 100
    CategoryRef:
      type: object
      description: The category of an entry, with its group, so the table needs no second lookup.
      additionalProperties: false
      required: [id, name, group]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 100
        group:
          $ref: '#/components/schemas/CategoryGroup'
    Client:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          description: Pseudonym or initials only (CLAUDE.md section 0.7).
          maxLength: 64
    ClientRequest:
      type: object
      description: Create or rename a client. Unknown fields are rejected.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Pseudonym or initials only. Unique per user, ignoring case.
          minLength: 1
          maxLength: 64
    ClientListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Client'
        page:
          $ref: '#/components/schemas/PageInfo'
    SessionTime:
      type: string
      description: Local clock time `HH:MM` with no timezone, on the session date.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      maxLength: 5
      examples: ['09:30']
    EntryStatus:
      type: string
      enum: [pending, approved, rejected]
    Entry:
      type: object
      description: |
        One of the caller's own entries. This is the owner's view only; peer and supervisor views
        use their own schemas and never reference this one (ARC-18).
      additionalProperties: false
      required: [id, session_date, duration_minutes, hours, category, clients, on_site, status, needs_time, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        session_date:
          type: string
          format: date
        start_time:
          $ref: '#/components/schemas/SessionTime'
        end_time:
          $ref: '#/components/schemas/SessionTime'
        duration_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
          description: Calculated by the server from the times; never sent in a request.
        hours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: Calculated by the server, `duration_minutes / 60`, shown to two decimals. Never sent in a request.
        category:
          $ref: '#/components/schemas/CategoryRef'
        clients:
          type: array
          maxItems: 50
          description: The saved clients on this entry, ordered by name.
          items:
            $ref: '#/components/schemas/Client'
        on_site:
          type: boolean
        notes:
          type: string
          maxLength: 2000
          description: Pseudonyms or initials only. Absent when there are no notes.
        status:
          $ref: '#/components/schemas/EntryStatus'
        needs_time:
          type: boolean
          description: True for entries imported without times; `start_time` and `end_time` are then absent.
        review_note:
          type: string
          maxLength: 2000
          description: The reviewer's reason, present on a rejected entry.
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EntryRequest:
      type: object
      description: |
        The editable fields of an entry, for create and for full replacement on update. There is no
        `hours` or `duration_minutes`: the server calculates them, and unknown fields are rejected
        (FR-LOG-02). Times are in 15-minute steps, the end is after the start, and a session does
        not cross midnight, so `end_time` is at most `23:45`.
      additionalProperties: false
      required: [session_date, start_time, end_time, category_id]
      properties:
        session_date:
          type: string
          format: date
        start_time:
          $ref: '#/components/schemas/SessionTime'
        end_time:
          $ref: '#/components/schemas/SessionTime'
        category_id:
          type: string
          format: uuid
          maxLength: 36
        client_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          description: Saved clients on this entry; all must belong to the caller. Defaults to none.
          items:
            type: string
            format: uuid
            maxLength: 36
        on_site:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 2000
          description: Pseudonyms or initials only; supervisors can read notes.
    EntryListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Entry'
        page:
          $ref: '#/components/schemas/PageInfo'
    ConflictingEntry:
      type: object
      description: The caller's own session that an overlapping request clashes with.
      additionalProperties: false
      required: [id, session_date, start_time, end_time]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        session_date:
          type: string
          format: date
        start_time:
          $ref: '#/components/schemas/SessionTime'
        end_time:
          $ref: '#/components/schemas/SessionTime'
    EntryConflictProblem:
      description: A 409 Problem for an entry. `conflicting_entry` is present only for `entry-overlap`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            conflicting_entry:
              $ref: '#/components/schemas/ConflictingEntry'
    ClientConflictProblem:
      description: |
        A 409 Problem for a client. `existing_client` is present only for `client-name-taken`;
        `entry_count` only for `client-in-use`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            existing_client:
              $ref: '#/components/schemas/Client'
            entry_count:
              type: integer
              format: int32
              minimum: 1
    ImportMarkdownRequest:
      type: object
      description: The upload. Unknown parts are rejected.
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          maxLength: 1048576
          description: The Markdown ledger, UTF-8 text, at most 1 MiB. Either layout is accepted.
    ImportReport:
      type: object
      description: |
        What an import did. Counts and lists contain no cell content other than client names,
        which are pseudonyms or initials only (CLAUDE.md section 0.7).
      additionalProperties: false
      required: [total_rows, imported_count, needs_time_count, merged_clients, skipped_count, skipped_rows]
      properties:
        total_rows:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          description: Rows found in the entries table; `imported_count + skipped_count`.
        imported_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          description: Entries created.
        needs_time_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          description: Of the imported entries, how many have no times and are flagged `needs_time`.
        merged_clients:
          type: array
          maxItems: 5000
          description: |
            Each distinct client name found in the file (the `Clients / Groups` section and the rows,
            ignoring case) and what happened to it. Ordered by name, then `id`.
          items:
            $ref: '#/components/schemas/MergedClient'
        skipped_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
        skipped_rows:
          type: array
          maxItems: 5000
          description: Rows that were not imported, in file order, each with the reason.
          items:
            $ref: '#/components/schemas/SkippedRow'
    MergedClient:
      type: object
      additionalProperties: false
      required: [client, created]
      properties:
        client:
          $ref: '#/components/schemas/Client'
        created:
          type: boolean
          description: True when the import saved a new client; false when a saved client already had that name.
    SkippedRow:
      type: object
      additionalProperties: false
      required: [row, reason, message]
      properties:
        row:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          description: 1-based position in the entries table, not counting the header rows.
        reason:
          $ref: '#/components/schemas/SkipReason'
        field:
          type: string
          maxLength: 100
          description: The column that caused the skip, when one did. Absent for `duplicate`, `overlap` and `malformed-row`.
        message:
          type: string
          maxLength: 500
          description: Human-readable explanation. It never quotes the cell.
    SkipReason:
      type: string
      description: |
        Why a row was not imported. `duplicate`: an existing entry has the same date, category,
        hours, notes and client set (ASM-07). `overlap`: the row has times that overlap another of
        the caller's non-rejected sessions. `malformed-row`: the row does not have the columns of
        the table. The others name the column whose value is invalid.
      enum:
        - duplicate
        - overlap
        - malformed-row
        - invalid-date
        - invalid-time
        - invalid-hours
        - unknown-category
        - invalid-client
        - invalid-notes
    PersonRef:
      type: object
      description: A person as other members of a supervision link see them. Display name only.
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 401
    SupervisorSummary:
      type: object
      description: A supervisor in the caller's organization, as listed by the search.
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 401
    SupervisorListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SupervisorSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    SupervisionRole:
      type: string
      description: |
        Which side of the link the caller is on. The values are not the bare role names so the
        generated Go constants do not collide with the `MeResponse` roles `admin` and `supervisor`.
      enum: [as_supervisee, as_supervisor]
    SupervisionLinkStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, ended]
    SupervisionRequest:
      type: object
      description: Request supervision from one supervisor. Unknown fields are rejected.
      additionalProperties: false
      required: [supervisor_id]
      properties:
        supervisor_id:
          type: string
          format: uuid
          maxLength: 36
    SupervisionLink:
      type: object
      additionalProperties: false
      required: [id, status, supervisee, supervisor, requested_at, responded_at, ended_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        status:
          $ref: '#/components/schemas/SupervisionLinkStatus'
        supervisee:
          $ref: '#/components/schemas/PersonRef'
        supervisor:
          $ref: '#/components/schemas/PersonRef'
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: [string, 'null']
          format: date-time
          description: When the supervisor accepted or declined; null for a pending or cancelled request.
        ended_at:
          type: [string, 'null']
          format: date-time
          description: When an accepted link was ended; null otherwise.
    SupervisionLinkListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SupervisionLink'
        page:
          $ref: '#/components/schemas/PageInfo'
    NotificationType:
      type: string
      description: |
        The event. New values may be added within v1, so clients show an unknown type generically.
      enum:
        - supervision.request_received
        - supervision.request_accepted
        - supervision.request_declined
        - supervision.link_ended
    NotificationPayload:
      type: object
      description: |
        What the inbox needs to render the event. Display names and ids only (never client names,
        notes or email addresses), at most 8 KiB.
      additionalProperties: false
      properties:
        link_id:
          type: string
          format: uuid
          maxLength: 36
        actor_id:
          type: string
          format: uuid
          maxLength: 36
        actor_name:
          type: string
          description: Display name of the person whose action caused the notification.
          maxLength: 401
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, payload, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          $ref: '#/components/schemas/NotificationPayload'
        read_at:
          type: [string, 'null']
          format: date-time
          description: Null while unread.
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Notification'
        page:
          $ref: '#/components/schemas/PageInfo'
    UnreadCount:
      type: object
      additionalProperties: false
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          format: int64
          minimum: 0
    MarkAllReadResult:
      type: object
      additionalProperties: false
      required: [marked_count]
      properties:
        marked_count:
          type: integer
          format: int64
          minimum: 0
    AdminRole:
      type: string
      description: A role an admin can grant. The base user capability is held by everyone and is not listed.
      enum: [admin, supervisor]
    AdminUserStatus:
      type: string
      description: '`deactivated` users cannot sign in and are hidden from every list except the admin user list.'
      enum: [active, deactivated]
    AdminOrganization:
      type: object
      description: An organization as the admin console sees it.
      additionalProperties: false
      required: [id, name, user_count, created_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 200
        user_count:
          type: integer
          format: int32
          minimum: 0
          description: Users who belong to the organization, active and deactivated. Delete is refused while this is above 0.
        created_at:
          type: string
          format: date-time
    AdminOrganizationRequest:
      type: object
      description: Create or rename an organization. Unknown fields are rejected.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Unique, ignoring case. Surrounding spaces are removed.
          minLength: 1
          maxLength: 200
    AdminOrganizationListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminOrganization'
        page:
          $ref: '#/components/schemas/PageInfo'
    AdminOrganizationConflictProblem:
      description: |
        A 409 Problem for an organization. `user_count` is present only for `organization-not-empty`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            user_count:
              type: integer
              format: int32
              minimum: 1
    AdminUser:
      type: object
      description: |
        A person as the admin console sees them. It describes the account only; it has no entries,
        notes or clients and never references the entry schemas (FR-ADM-10, ARC-18).
      additionalProperties: false
      required: [id, first_name, last_name, name, email, roles, organization, status, has_signed_in, created_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        first_name:
          type: string
          maxLength: 200
        last_name:
          type: string
          maxLength: 200
        name:
          type: string
          description: Display name, `first_name` and `last_name`, or the email when both are empty.
          maxLength: 401
        email:
          type: string
          format: email
          maxLength: 254
        roles:
          type: array
          uniqueItems: true
          maxItems: 2
          description: Roles held. An ordinary user has an empty array.
          items:
            $ref: '#/components/schemas/AdminRole'
        organization:
          $ref: '#/components/schemas/OrganizationProfile'
        status:
          $ref: '#/components/schemas/AdminUserStatus'
        deactivated_at:
          type: string
          format: date-time
          description: Present only while the user is deactivated.
        has_signed_in:
          type: boolean
          description: True once a first sign-in has bound the user to an identity. False for an invited user who has not signed in yet.
        invitation_status:
          type: string
          description: |
            State of the user's latest invitation. `pending` can still be redeemed; `expired` needs a
            new invitation; `accepted` was redeemed by the first sign-in. Absent when the user has none.
          enum: [pending, expired, accepted]
        invitation_expires_at:
          type: string
          format: date-time
          description: Present while `invitation_status` is `pending` or `expired`.
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          $ref: '#/components/schemas/PageInfo'
    AdminUserCreateRequest:
      type: object
      description: Invite a user. The organization is required. Unknown fields are rejected.
      additionalProperties: false
      required: [first_name, last_name, email, organization_id]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 200
        last_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          description: The Google account the person will sign in with. Unique among users, ignoring case.
          maxLength: 254
        roles:
          type: array
          uniqueItems: true
          maxItems: 2
          description: Roles to grant. Defaults to none (an ordinary user).
          items:
            $ref: '#/components/schemas/AdminRole'
        organization_id:
          type: string
          format: uuid
          maxLength: 36
    AdminUserUpdateRequest:
      type: object
      description: Edit a user's name. At least one field is required. Unknown fields are rejected.
      additionalProperties: false
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 200
        last_name:
          type: string
          minLength: 1
          maxLength: 200
    AdminUserRolesRequest:
      type: object
      description: The complete role set. Unknown fields are rejected.
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: '#/components/schemas/AdminRole'
    AdminUserEmailRequest:
      type: object
      description: The user's new email. Unknown fields are rejected.
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AdminUserOrganizationRequest:
      type: object
      description: Move a user. Unknown fields are rejected.
      additionalProperties: false
      required: [organization_id, confirm_consequences]
      properties:
        organization_id:
          type: string
          format: uuid
          maxLength: 36
        confirm_consequences:
          type: boolean
          description: Must be `true`; the admin has seen the consequences from the preview.
          enum: [true]
    AdminOrganizationChangePreview:
      type: object
      description: What an organization change would do. Nothing has changed when this is returned.
      additionalProperties: false
      required: [user_id, current_organization, target_organization, is_supervisor, consequences]
      properties:
        user_id:
          type: string
          format: uuid
          maxLength: 36
        current_organization:
          $ref: '#/components/schemas/OrganizationProfile'
        target_organization:
          $ref: '#/components/schemas/OrganizationProfile'
        is_supervisor:
          type: boolean
          description: True when the user holds the supervisor role, so their supervisees' links end too.
        consequences:
          $ref: '#/components/schemas/AdminOrganizationChangeConsequences'
    AdminOrganizationChangeConsequences:
      type: object
      additionalProperties: false
      required: [links_ended, requests_cancelled]
      properties:
        links_ended:
          type: integer
          format: int32
          minimum: 0
          description: Accepted supervision links that would end, as supervisee and, for a supervisor, as supervisor.
        requests_cancelled:
          type: integer
          format: int32
          minimum: 0
          description: Pending supervision requests that would be cancelled.
    AdminAuditEntry:
      type: object
      description: One audit row. Names are snapshots taken when the action happened.
      additionalProperties: false
      required: [id, created_at, action, actor_name, details]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        created_at:
          type: string
          format: date-time
        action:
          type: string
          description: |
            Dotted lowercase action name, for example `organization.create`, `organization.rename`,
            `organization.delete`, `user.create`, `user.update`, `user.roles_change`,
            `user.organization_change`, `user.email_change`, `user.deactivate`, `user.reactivate` or
            `user.delete`. Clients display unknown names as they are.
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          maxLength: 100
        actor_id:
          type: string
          format: uuid
          maxLength: 36
          description: The admin who acted. Absent once that user has been permanently deleted.
        actor_name:
          type: string
          maxLength: 400
        target_user_id:
          type: string
          format: uuid
          maxLength: 36
          description: The user acted on. Absent for actions on no user, and once that user has been permanently deleted.
        target_name:
          type: string
          maxLength: 400
          description: Display name of the user acted on, when the action had one. It stays after that user is deleted.
        details:
          $ref: '#/components/schemas/AdminAuditDetails'
    AdminAuditDetails:
      type: object
      description: |
        What changed, as a small JSON object (for example the old and new role set). Keys depend on
        `action`. It holds account facts only, never entry, note or client content.
      additionalProperties: true
      maxProperties: 50
    AdminAuditListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminAuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    GatewayUnauthorized:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 200
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build identifier, for example the backend commit SHA.
          maxLength: 64
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          maxLength: 200
          description: Stable URN for the error kind, for example `urn:therapy-service-hours:problem:not-found`.
          examples: ['urn:therapy-service-hours:problem:not-found']
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        request_id:
          type: string
          maxLength: 64
          description: Quote this when reporting a problem; it matches the server logs.
        errors:
          type: array
          maxItems: 100
          description: Invalid fields, for validation problems only.
          items:
            $ref: '#/components/schemas/ProblemField'
    ProblemField:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 500
    PageInfo:
      type: object
      description: Pagination metadata returned by every list endpoint.
      additionalProperties: false
      required: [page, page_size, total_items]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total_items:
          type: integer
          format: int64
          minimum: 0
