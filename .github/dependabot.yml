# Dependency updates (SEC-72): Go modules and GitHub Actions, weekly, grouped to limit PR noise.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
