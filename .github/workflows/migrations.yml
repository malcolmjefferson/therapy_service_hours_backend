name: migrations

# ADR-0003: migrations are forward-only and additive unless tagged `-- +contract`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  additive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The check rejects an untagged DROP
        run: scripts/check-migrations.sh --self-test
      - name: No untagged destructive statement in db/migrations
        run: scripts/check-migrations.sh
